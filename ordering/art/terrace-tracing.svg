    <path d="M1080 140 C1060 150 1040 145 1020 160"/>
    <path d="M1000 180 C985 195 960 190 945 205"/>
    <path d="M1130 200 C1110 205 1090 220 1085 245 C1080 265 1090 290 1105 300"/>
    <path d="M1195 240 C1170 255 1160 280 1175 300"/>
    <!-- leaf tufts -->
    <path d="M1060 40 c6 -12 18 -14 26 -4 c8 8 4 20 -8 22 c-10 2 -20 -6 -18 -18z"/>
    <path d="M980 150 c5 -10 16 -12 22 -3 c6 8 2 18 -8 19 c-9 1 -17 -6 -14 -16z"/>
    <path d="M1120 110 c5 -10 16 -12 22 -3 c6 8 2 18 -8 19 c-9 1 -17 -6 -14 -16z"/>

    <path d="M70 520 H330 V600 H70 Z" stroke-width="2"/>
    <path d="M70 520 Q70 500 90 500 H310 Q330 500 330 520" stroke-width="1.6"/>
    <path d="M100 520 V600 M130 520 V600 M160 520 V600 M190 520 V600 M220 520 V600 M250 520 V600 M280 520 V600 M310 520 V600" stroke-width=".9" opacity=".5"/>

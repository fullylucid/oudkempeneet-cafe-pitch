    <g stroke="#C9A96A">
      <path d="M110 335 Q200 292 290 335"/>
      <path d="M110 335 q22 -10 45 0 q22 -10 45 0 q22 -10 45 0 q22 -10 45 0" stroke-width="1.6"/>

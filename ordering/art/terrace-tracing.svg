    <path d="M700 300 L660 175 M800 300 L735 150 M900 300 L820 178 M1000 300 L905 205 M1090 300 L1000 232" stroke-width="1.1" opacity=".6"/>
    <!-- chimney -->
    <path d="M628 214 L628 178 L650 178 L650 222"/>
    <!-- eave line and facade -->
    <path d="M540 300 L1165 300 L1165 400"/>
    <path d="M540 300 L540 400"/>

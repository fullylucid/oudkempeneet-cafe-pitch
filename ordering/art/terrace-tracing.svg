    <path d="M640 322 L1050 322 L1050 362 L640 362 Z"/>
    <path d="M700 322 V362 M760 322 V362 M820 322 V362 M880 322 V362 M940 322 V362 M1000 322 V362" stroke-width="1.2" opacity=".7"/>

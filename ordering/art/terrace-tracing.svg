      <path d="M320 470 q0 -26 26 -26 q26 0 26 26 v28"/>
      <path d="M380 455 q0 -24 24 -24 q24 0 24 24 v26"/>
      <path d="M480 452 q0 -24 24 -24 q24 0 24 24 v24"/>
      <path d="M570 470 q0 -28 28 -28 q28 0 28 28 v34 M574 492 h48"/>
      <path d="M715 470 q0 -30 30 -30 q30 0 30 30 v40"/>

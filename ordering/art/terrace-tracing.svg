    <path d="M830 440 c5 -18 22 -22 30 -8 c8 -14 26 -10 30 8" stroke="#6E7F3A"/>
    <!-- bicycle right -->
    <g stroke-width="1.8">
      <circle cx="988" cy="482" r="27"/><circle cx="1062" cy="482" r="27"/>
      <path d="M988 482 L1015 440 L1050 440 L1062 482 M1015 440 L1030 482 L988 482 M1030 482 L1050 440 M1012 430 H1024 M1046 434 L1060 428"/>
